name: qurani_1
description: تطبيق قرآني الشامل - المصحف الشريف والتلاوات والأذكار والتحميلات أوفلاين.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- الخطوط والتصميم الإسلامي ---
  google_fonts: ^6.2.1

  # --- التخزين المحلي والكاش ---
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3 # ضرورية لحفظ صفحات المصحف والسور الصوتية للعمل بدون إنترنت

  # --- مشغل الصوتيات للتلاوات ---
  just_audio: ^0.9.38

  # --- مواقيت الصلاة والموقع الجغرافي ---
  adhan: ^2.0.0+1       # تم تثبيت الإصدار المستقر والمتوافق
  geolocator: ^12.0.0

  # --- الاتصال بالإنترنت والمشاركة ---
  http: ^1.2.1          # لجلب الآيات وصور الصفحات والتسجيلات
  share_plus: ^9.0.0    # لمشاركة الآيات والأذكار

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true