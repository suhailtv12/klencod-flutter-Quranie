name: qurani_1
description: تطبيق قرآني الشامل مع مشغل الخلفية وإشعارات الصلاة وفايربيس.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- الخطوط والتصميم الإسلامي ---
  google_fonts: ^6.2.1

  # --- التخزين المحلي والكاش ---
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # --- مشغل الصوتيات وشاشة القفل ---
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.13

  # --- إشعارات الصلاة والجدولة اليومية ---
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # --- إشعارات فايربيس ---
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # --- مواقيت الصلاة والموقع ---
  adhan: ^2.0.0+1
  geolocator: ^12.0.0
  http: ^1.2.1

  # تم تحديث الإصدار هنا لحل التعارض مع فايربيس نهائياً
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true